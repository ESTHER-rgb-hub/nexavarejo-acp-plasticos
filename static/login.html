<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaVarejo — Acesso ao Sistema</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body.alto-contraste,
        body.alto-contraste div,
        body.alto-contraste input {
            background-color: #000000 !important;
            color: #FFFF00 !important;
            border-color: #FFFF00 !important;
        }
        body.alto-contraste a,
        body.alto-contraste button.btn-acao {
            background-color: #FFFF00 !important;
            color: #000000 !important;
            border: 2px solid #FFFFFF !important;
            font-weight: 900 !important;
        }
        body.fonte-grande .texto-dinamico {
            font-size: 1.05rem !important;
            line-height: 1.4 !important;
        }
    </style>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center p-2 transition-colors">
    <div class="bg-white p-5 rounded-2xl shadow-lg w-full max-w-[360px] border border-gray-200 min-h-screen flex flex-col justify-between">
        <div>
            <!-- Barra de Acessibilidade -->
            <div class="flex gap-2 mb-5 pb-3 border-b border-gray-200" role="region" aria-label="Controles de Acessibilidade">
                <button onclick="alternarContraste()" class="btn-acao flex-1 bg-slate-900 text-white text-xs font-bold py-2 px-2 rounded-lg cursor-pointer">
                    🌓 Alto Contraste
                </button>
                <button onclick="alternarFonte()" class="btn-acao flex-1 bg-slate-200 text-slate-900 text-xs font-bold py-2 px-2 rounded-lg cursor-pointer">
                    🔍 Fonte (A+)
                </button>
            </div>

            <!-- Cabeçalho -->
            <div class="mb-6">
                <span class="text-[10px] font-bold bg-blue-100 text-blue-800 px-2.5 py-1 rounded-full">PWA INDUSTRIAL</span>
                <h1 class="text-xl font-bold text-gray-900 mt-2">NexaVarejo</h1>
                <p class="texto-dinamico text-xs text-gray-600">ACP Plásticos · Controle de Chão de Fábrica</p>
            </div>

            <!-- Formulário de Login -->
            <form onsubmit="event.preventDefault(); window.location.href='estoque-kanban.html';" class="space-y-4">
                <div>
                    <label for="email" class="texto-dinamico block text-xs font-bold text-gray-700 mb-1">E-mail Corporativo</label>
                    <input id="email" type="email" required value="operador.fabbri@acpplasticos.com.br"
                        class="texto-dinamico w-full p-3 text-sm border-2 border-gray-300 rounded-xl focus:border-blue-600 outline-none">
                </div>

                <div>
                    <label for="senha" class="texto-dinamico block text-xs font-bold text-gray-700 mb-1">Senha de Acesso</label>
                    <input id="senha" type="password" required value="acp2026"
                        class="texto-dinamico w-full p-3 text-sm border-2 border-gray-300 rounded-xl focus:border-blue-600 outline-none">
                </div>

                <button type="submit" class="btn-acao w-full bg-blue-700 text-white font-bold py-3.5 rounded-xl text-sm min-h-[44px] hover:bg-blue-800 cursor-pointer mt-2">
                    Entrar no Painel →
                </button>
            </form>
        </div>

        <p class="text-[11px] text-center text-gray-400 mt-6">Autenticação Segura via JWT · WCAG 2.1 AA</p>
    </div>

    <script>
        if (localStorage.getItem('altoContraste') === 'true') document.body.classList.add('alto-contraste');
        if (localStorage.getItem('fonteGrande') === 'true') document.body.classList.add('fonte-grande');

        function alternarContraste() {
            document.body.classList.toggle('alto-contraste');
            localStorage.setItem('altoContraste', document.body.classList.contains('alto-contraste'));
        }
        function alternarFonte() {
            document.body.classList.toggle('fonte-grande');
            localStorage.setItem('fonteGrande', document.body.classList.contains('fonte-grande'));
        }
    </script>
</body>
</html>
