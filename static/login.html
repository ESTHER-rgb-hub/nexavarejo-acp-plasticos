<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaVarejo — Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-6 rounded-2xl shadow-lg w-full max-w-[360px] border border-gray-200">
        <div class="flex items-center space-x-3 mb-6">
            <div class="bg-blue-700 text-white font-bold px-3 py-2 rounded-lg text-lg">NV</div>
            <div>
                <h1 class="text-xl font-bold text-gray-900 leading-tight">NexaVarejo</h1>
                <p class="text-xs text-gray-500 font-medium">ACP Plásticos</p>
            </div>
        </div>

        <h2 class="text-2xl font-bold text-gray-900 mb-1">Entrar</h2>
        <p class="text-xs text-gray-600 mb-6">Acesse seu painel de Atendimento ou Produção.</p>

        <form action="estoque-kanban.html" class="space-y-4">
            <div>
                <label for="email" class="block text-xs font-bold text-gray-800 mb-1">E-mail</label>
                <input type="email" id="email" value="operador.fabbri@acpplasticos.com.br" required
                    class="w-full p-3 text-sm border-2 border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <div>
                <label for="senha" class="block text-xs font-bold text-gray-800 mb-1">Senha</label>
                <input type="password" id="senha" value="••••••••" required
                    class="w-full p-3 text-sm border-2 border-gray-700 rounded-xl focus:ring-2 focus:ring-blue-600 focus:outline-none">
            </div>

            <button type="submit" 
                class="w-full bg-blue-700 hover:bg-blue-800 text-white font-bold py-3 px-4 rounded-xl text-base min-h-[52px] shadow-md transition-all">
                Entrar
            </button>
        </form>

        <div class="mt-4 text-center">
            <a href="#" class="text-xs text-gray-500 hover:underline">Clique aqui para simular erro de login</a>
        </div>

        <footer class="mt-8 pt-4 border-t border-gray-100 text-center">
            <p class="text-[10px] text-gray-400">Conexão segura · token JWT · senha com hash bcrypt</p>
        </footer>
    </div>
</body>
</html>
