<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaVarejo — Estoque e Produção</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center p-2">
    <div class="bg-white p-4 rounded-2xl shadow-lg w-full max-w-[360px] border border-gray-200 min-h-screen">
        <!-- Header com Alerta -->
        <div class="flex justify-between items-center mb-4">
            <h1 class="text-lg font-bold text-gray-900">Estoque e Produção</h1>
            <a href="alertas-status.html" class="relative bg-red-100 p-2 rounded-xl text-red-700 font-bold border border-red-300">
                ⚠️ <span class="absolute -top-1 -right-1 bg-red-600 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center">2</span>
            </a>
        </div>

        <!-- Busca por SKU -->
        <input type="text" placeholder="PLAST-" class="w-full p-2.5 text-sm border-2 border-gray-400 rounded-xl mb-4">

        <!-- Saldo em Tempo Real -->
        <div class="bg-blue-50/50 p-3 rounded-xl mb-4 border border-blue-100">
            <h2 class="text-[11px] font-bold text-blue-800 tracking-wider mb-2">SALDO EM TEMPO REAL</h2>
            <div class="space-y-1.5 text-xs font-semibold">
                <div class="flex justify-between"><span>PLAST-PEAD-001 · PEAD</span><span>1.250 kg</span></div>
                <div class="flex justify-between text-red-600 font-bold"><span>PLAST-PP-004 · PP Injetável</span><span>▲ 80 kg</span></div>
                <div class="flex justify-between"><span>PLAST-PVC-010 · PVC</span><span>640 kg</span></div>
            </div>
        </div>

        <!-- Kanban -->
        <div class="flex justify-between items-center text-xs font-bold text-gray-700 mb-2">
            <span>Ordem em destaque</span>
            <span class="bg-gray-200 px-2 py-0.5 rounded-full text-[10px]">1</span>
        </div>

        <!-- Card Kanban Ativo -->
        <div class="border-2 border-blue-200 bg-blue-50/30 p-3 rounded-xl mb-4">
            <span class="text-[10px] bg-gray-200 text-gray-700 px-2 py-0.5 rounded font-bold">Aguardando</span>
            <h3 class="font-bold text-sm text-gray-900 mt-1">#OP-2026-88</h3>
            <p class="text-xs text-gray-600 mb-3">Lote 500 un · Baldes 20L · PEAD</p>
            <a href="alertas-status.html" class="block text-center w-full bg-blue-700 text-white font-bold py-3 rounded-xl text-sm min-h-[44px]">
                Iniciar produção →
            </a>
        </div>
    </div>
</body>
</html>
