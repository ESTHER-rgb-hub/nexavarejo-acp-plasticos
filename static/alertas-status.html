<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NexaVarejo — Alertas</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex justify-center p-2">
    <div class="bg-white p-4 rounded-2xl shadow-lg w-full max-w-[360px] border border-gray-200 min-h-screen">
        <!-- Banner de Conexão Offline -->
        <div class="bg-amber-50 border border-amber-300 p-2.5 rounded-xl flex items-center space-x-2 text-xs font-bold text-amber-800 mb-4">
            <span>◆ Sincronizando offline (2 ações salvas)</span>
        </div>

        <h1 class="text-lg font-bold text-gray-900 mb-3">Alertas de estoque</h1>

        <!-- Alerta Crítico (Triângulo + Vermelho) -->
        <div class="bg-red-50/40 border-2 border-red-500 p-3 rounded-xl mb-3">
            <div class="flex space-x-2">
                <span class="text-red-600 font-bold text-lg">▲</span>
                <div>
                    <h2 class="text-xs font-bold text-gray-900">PLAST-PP-004 · Polipropileno Injetável</h2>
                    <p class="text-[11px] font-bold text-red-700">Abaixo do Ponto de Reserva</p>
                    <p class="text-[10px] text-gray-600 mt-1">Saldo: 80 kg · Ponto de reserva: 150 kg</p>
                </div>
            </div>
        </div>

        <!-- Alerta Atenção (Círculo + Amarelo) -->
        <div class="bg-amber-50/40 border-2 border-amber-400 p-3 rounded-xl mb-6">
            <div class="flex space-x-2">
                <span class="text-amber-600 font-bold text-lg">●</span>
                <div>
                    <h2 class="text-xs font-bold text-gray-900">PLAST-PVC-010 · PVC</h2>
                    <p class="text-[11px] font-bold text-amber-700">Perto do Ponto de Reserva</p>
                    <p class="text-[10px] text-gray-600 mt-1">Saldo: 640 kg · Ponto de reserva: 500 kg</p>
                </div>
            </div>
        </div>

        <!-- Botões de Ação -->
        <button class="w-full bg-blue-700 text-white font-bold py-3 rounded-xl text-sm min-h-[44px] mb-2">
            Confirmar baixa de estoque
        </button>
        <button class="w-full bg-white border-2 border-blue-700 text-blue-700 font-bold py-3 rounded-xl text-sm min-h-[44px]">
            Sincronizar agora
        </button>
    </div>
</body>
</html>
